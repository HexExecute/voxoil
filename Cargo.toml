[package]
name = "voxoil"
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT"

[lib]
name = "voxoil"

[dependencies]
arrayvec = "0.7.6"
bytemuck = { version = "1.23.2", features = [ "derive" ] }
glam = "0.30.5"
rand = "0.9.2"
rand_chacha = "0.9.0"
dhat = { version = "0.3.3", optional = true }

[dev-dependencies]
criterion = "0.7.0"

[profile.release]
debug = 1

[[bench]]
name = "traversal"

[[bench]]
name = "memory"
harness = false

[features]
dhat-heap = ["dhat"]
